# PayAssist AI backend - base configuration (secure defaults; production-like).
# Every secret comes from an environment variable without a default, so a missing secret fails
# startup. The 'dev' profile (application-dev.yml) adds synthetic seed data and OpenAPI docs.
spring:
  application:
    name: payassist-backend
  datasource:
    url: ${PAYASSIST_DB_URL}
    username: ${PAYASSIST_DB_USERNAME}
    password: ${PAYASSIST_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches.
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true               # Java 21 virtual threads for request handling

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PAYASSIST_SESSION
        http-only: true
        secure: ${PAYASSIST_COOKIE_SECURE:true}
        same-site: lax            # Lax (not Strict) so the OIDC redirect back from Keycloak carries the cookie.

payassist:
  security:
    public-base-url: ${PAYASSIST_PUBLIC_BASE_URL}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      backchannel-uri: ${KEYCLOAK_BACKCHANNEL_URI:}
      client-id: ${KEYCLOAK_CLIENT_ID:payassist-bff}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
