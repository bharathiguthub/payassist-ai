# PayAssist AI backend - base configuration (secure defaults; production-like).
# Every secret comes from an environment variable without a default, so a missing secret fails
# startup. The 'dev' profile (application-dev.yml) adds synthetic seed data and OpenAPI docs.
spring:
  application:
    name: payassist-backend
  datasource:
    url: ${PAYASSIST_DB_URL}
    username: ${PAYASSIST_DB_USERNAME}
    password: ${PAYASSIST_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks it matches.
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true               # Java 21 virtual threads for request handling

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        name: PAYASSIST_SESSION
        http-only: true
        secure: ${PAYASSIST_COOKIE_SECURE:true}
        same-site: lax            # Lax (not Strict) so the OIDC redirect back from Keycloak carries the cookie.

payassist:
  security:
    public-base-url: ${PAYASSIST_PUBLIC_BASE_URL}
    keycloak:
      issuer-uri: ${KEYCLOAK_ISSUER_URI}
      backchannel-uri: ${KEYCLOAK_BACKCHANNEL_URI:}
      client-id: ${KEYCLOAK_CLIENT_ID:payassist-bff}
      client-secret: ${KEYCLOAK_CLIENT_SECRET}

  # SYNTHETIC refund policy (not a real scheme or merchant policy). See RefundPolicy and ADR 0010.
  # Change 'version' whenever any value below changes: every decision and audit record carries it.
  refund:
    policy:
      version: SYNTHETIC-REFUND-POLICY-2026.11-v1
      supported-currencies: [GBP, USD, EUR, INR]
      methods:
        CARD:
          refunds-enabled: true
          refund-window-days: 120
          partial-refunds-allowed: true
        WALLET:
          refunds-enabled: true
          refund-window-days: 90
          partial-refunds-allowed: true
        BANK_TRANSFER:
          refunds-enabled: true
          refund-window-days: 60
          partial-refunds-allowed: false
      # Largest refund a CARE_SUPERVISOR may approve; above this the refund needs escalation.
      supervisor-approval-limits:
        GBP: 1000.00
        USD: 1250.00
        EUR: 1150.00
        INR: 100000.00

  # Synthetic thresholds for time-based investigation findings (see InvestigationProperties).
  investigation:
    pending-alert-after: 24h
    authorized-alert-after: 7d
    settlement-delay-after: 3d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [cid=%X{correlationId:-}]"
